name: Validate ontology

on:
  pull_request:
    paths:
      - 'pathways/**/*.json'
      - 'pathwise_ontology.json'
      - 'schema.json'
      - 'validate.py'
      - 'check_unique_ids.py'
      - 'validate_pathway_ontology.py'
      - '.github/workflows/validate_ontology.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate ontology schema
        run: python validate.py

      - name: Check ontology IDs are unique
        run: python check_unique_ids.py pathwise_ontology.json

      - name: Test pathway reference validator
        run: python -m unittest -v test_validate_pathway_ontology.py

      - name: Validate pathway ontology references
        if: github.event_name == 'pull_request'
        run: python validate_pathway_ontology.py --changed-from "origin/${{ github.base_ref }}"

      - name: Validate all pathway ontology references
        if: github.event_name == 'workflow_dispatch'
        run: python validate_pathway_ontology.py

      - name: Upload missing-entry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-ontology-entries
          path: missing_ontology_entries.md
          if-no-files-found: ignore
